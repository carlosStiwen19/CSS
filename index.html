<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heladería 3381732</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="header">
        <nav class="menu-lateral">
            <ul class="menu-lateral__list">
                <li class="menu-lateral__item"><a href="#" class="menu-lateral__link">Inicio</a></li>
                <li class="menu-lateral__item"><a href="#" class="menu-lateral__link">Productos</a></li>
                <li class="menu-lateral__item"><a href="#" class="menu-lateral__link">Contacto</a></li>
            </ul>
        </nav>
    </header>

    <main class="main-container">
        <section class="catalogo">
            <h2 class="catalogo__title">Nuestros Productos</h2>
            
            <div class="catalogo__grid">
                <!-- Tarjeta 1 -->
                <article class="card">
                    <span class="card__badge">¡Nuevo!</span>
                    <img src="helado1.jpg" alt="Producto 1" class="card__image">
                    <div class="card__content">
                        <h3 class="card__title">Producto 1</h3>
                        <p class="card__description">Descripción del producto uno.</p>
                        <span class="card__price">$50.000</span>
                        <button class="btn btn--primario">Comprar</button>
                    </div>
                </article>

                <!-- Tarjeta 2 -->
                <article class="card">
                    <span class="card__badge">¡Nuevo!</span>
                    <img src="helado2.jpg" alt="Producto 2" class="card__image">
                    <div class="card__content">
                        <h3 class="card__title">Producto 2</h3>
                        <p class="card__description">Descripción del producto dos.</p>
                        <span class="card__price">$75.000</span>
                        <button class="btn btn--primario">Comprar</button>
                    </div>
                </article>
            </div>
        </section>
    </main>
</body>
</html>
